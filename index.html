<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IM Campaign</title>
<meta name="theme-color" content="#0e1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IM Campaign">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1115; --panel:#161a20; --panel2:#1c2129; --line:#2a313b; --line2:#353e4a;
  --text:#e8e3d6; --muted:#8e96a3; --dim:#5f6774;
  --brass:#d4a24c; --brass-dim:#8a6a33;
  --us:#3f7fc4; --enemy-red:#c8463d;
  --good:#5fb38a; --warn:#d9a441; --bad:#d0584f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--brass);letter-spacing:.22em;text-transform:uppercase;margin-top:4px;font-weight:600}
.top .spacer{flex:1}
.countdown{text-align:right;line-height:1.05}
.countdown b{font-family:var(--mono);font-size:21px;color:var(--brass)}
.countdown span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.chip.ok i{background:var(--good)} .chip.busy i{background:var(--warn)} .chip.err i{background:var(--bad)}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:9px 12px;color:var(--muted);font-family:var(--display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-color:var(--brass)}
.grid{display:grid;gap:10px}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.stats{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}
.card h3{margin:0 0 7px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1}
.big small{font-size:13px;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.4}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:9px;border:1px solid var(--line)}
.bar>div{height:100%;background:var(--brass);transition:width .6s ease}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-brass{color:var(--brass)} .c-muted{color:var(--muted)} .c-us{color:#79aee8}
.row{display:flex;gap:10px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--brass-dim)}
.btn.pri{background:var(--brass);color:#1a1408;border-color:var(--brass)}
.btn.red{background:#5a1f1c;border-color:#8a3530}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
/* banner */
.banner{border-radius:10px;padding:11px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:16px}
.banner.siege{background:linear-gradient(90deg,#3a1513,#22110f);border:1px solid #7a2c27}
.banner.attack{background:linear-gradient(90deg,#3b2a0e,#1f1a10);border:1px solid #8a6a33}
.banner.info{background:var(--panel);border:1px solid var(--line2)}
/* map */
.mapwrap{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b1a24}
svg.map{display:block;width:100%;height:min(66vh,760px,62vw);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.map.dragging{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:36px;height:36px;border-radius:8px;background:rgba(14,17,21,.85);border:1px solid var(--line2);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.mapctl button.on{border-color:var(--brass);color:var(--brass)}
.maplegend{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(14,17,21,.82);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(255,255,255,.25)}
.maphint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;background:rgba(58,40,10,.92);border:1px solid var(--brass);border-radius:8px;padding:8px 12px;font-size:14px;display:none;gap:10px;align-items:center;white-space:nowrap}
.maphint.show{display:flex}
.town{cursor:pointer}
.town path.t{stroke:rgba(10,8,6,.7);stroke-width:.9;vector-effect:non-scaling-stroke;transition:fill .5s}
.town:hover path.t{stroke:#fff;stroke-width:1.4}
.town.sel path.t{stroke:#ffe9b0;stroke-width:2.2}
.town.cand path.t{stroke:#ffd27a;stroke-width:2;stroke-dasharray:5 4;animation:march 1s linear infinite}
.town.target path.t{stroke:#ffb347;stroke-width:2.4;stroke-dasharray:7 4;animation:march 1.2s linear infinite}
.town.attacked path.t{stroke:#ff4d40;stroke-width:2.6;animation:blink 1s ease infinite}
@keyframes march{to{stroke-dashoffset:-22}}
@keyframes blink{50%{stroke-opacity:.25}}
.rborder{fill:none;stroke:rgba(245,236,214,.75);stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}
.marker{pointer-events:none}
.lbl{font-family:var(--display);font-weight:700;letter-spacing:.04em;fill:#f6f0e2;paint-order:stroke;stroke:#14100c;stroke-linejoin:round;pointer-events:none}
.rlbl{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;fill:rgba(255,246,225,.88);paint-order:stroke;stroke:rgba(10,8,6,.85);stroke-linejoin:round;pointer-events:none}
.arrow{fill:none;stroke:#ffb347;stroke-linecap:round;pointer-events:none;filter:drop-shadow(0 0 3px rgba(0,0,0,.8))}
.arrow.enemy{stroke:#ff4d40}
.flash{animation:flash 1.4s ease 2}
@keyframes flash{50%{filter:brightness(2)}}
/* lists */
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.log li:first-child{border-top:0}
.log .d{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:52px;padding-top:2px}
.log .x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;line-height:1;padding:0 4px}
.log .x:hover{color:var(--bad)}
.two{grid-template-columns:1fr 1fr;margin-top:10px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line2);flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:#24402f;border-color:var(--good)} .sw.on::after{left:22px;background:var(--good)}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.dots i.y{background:var(--good);border-color:var(--good)} .dots i.n{background:#3a1e20;border-color:#5a2a2d}
.fabs{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:20;display:flex;gap:8px;align-items:center}
.fab{background:var(--brass);color:#1a1408;border:0;border-radius:999px;padding:14px 20px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line2);padding:13px 16px}
main{padding-bottom:110px}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,9,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.hidden{display:none}
.sheet{background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:600px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + var(--safe-b))}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:14px;border-bottom:1px solid var(--line2)}}
.sheet h2{margin:0 0 4px;font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.field{margin-top:13px}
.field label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.field input[type=number],.field input[type=text],.field input[type=password],.field input[type=date],.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:16px}
.field textarea{min-height:120px;font-family:var(--mono);font-size:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;border-radius:6px;padding:8px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--brass-dim)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--text)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:8px}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){font-family:var(--mono);text-align:right}
.qrows{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.qrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-top:1px solid var(--line);font-size:13px}
.qrow:first-child{border-top:0}
.qrow button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);background:#173126;color:var(--good);font-weight:700}
.qrow button.x{background:#3a1715;color:var(--bad)}
.qrow .t{color:var(--muted);font-size:12px}
.battles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.battle .res{font-family:var(--mono);font-size:28px;font-weight:700;margin:8px 0}
.final{border-color:var(--brass-dim);background:linear-gradient(180deg,#1f1a10,var(--panel))}
.sysrow{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.sysrow input{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;width:100%;text-align:right;font-family:var(--mono)}
.offdays{display:flex;flex-wrap:wrap;gap:4px}
.offdays button{width:36px;height:36px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted);padding:0}
.offdays button.off{background:#3a1e20;border-color:#6b3236;color:var(--text)}
.offdays .mo{width:100%;font-size:12px;color:var(--muted);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.1em}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);border:1px solid var(--brass-dim);padding:10px 16px;border-radius:8px;z-index:90;transition:.3s;font-size:14px;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#op.show ~ #toast{bottom:auto;top:calc(64px + var(--safe-t))}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:22px}
.tblwrap{overflow-x:auto;margin-top:8px}
table.st{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.st th{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.st td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left;font-family:var(--body)}
table.st tr.today td{background:rgba(212,162,76,.06)}
table.st tr.sum td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.wkhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wkstats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wkstats b{color:var(--text);font-family:var(--mono)}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;font-family:var(--body)}
.tag.siege{background:#3a1513;color:#f2a49b} .tag.atk{background:#162a40;color:#9cc4f0} .tag.leave{background:#222;color:var(--muted)}
@media (max-width:600px){ svg.map{height:62vh} .brand b{font-size:19px} .brand span{font-size:9.5px} .countdown b{font-size:18px} .mapctl{top:auto;bottom:62px} }
/* report */
.rep h4{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-size:13px;margin:16px 0 6px}
.rep ul{margin:0;padding-left:18px;line-height:1.55;font-size:14px}
.rep li{margin:2px 0}
/* live operation */
#op{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#1b2230,#090b0e 70%);display:none;flex-direction:column;padding:calc(12px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
#op.show{display:flex}
.op-head{display:flex;align-items:center;gap:10px;max-width:760px;width:100%;margin:0 auto}
.op-name{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:1px dashed var(--line2);padding:2px 0;min-width:0;flex:1}
.op-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.op-city{width:min(78vw,46vh,420px);height:auto}
.op-stats{display:flex;gap:18px;font-family:var(--mono);font-size:14px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.op-stats b{color:var(--text);font-size:18px}
.op-msg{min-height:24px;font-family:var(--display);font-size:20px;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.op-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px;margin:0 auto}
.op-btns button{height:76px;border-radius:14px;font-size:30px;font-weight:700;border:0}
.op-ok{background:#1f5e43;color:#d9ffe9}
.op-no{background:#6b2420;color:#ffe1dc}
.op-ok:active,.op-no:active{transform:scale(.97)}
.op-foot{display:flex;gap:10px;justify-content:space-between;max-width:520px;width:100%;margin:10px auto 0}
.dist{transition:fill .35s ease}
.dist.hit{animation:hit .5s ease}
@keyframes hit{50%{filter:brightness(1.9)}}
.shake{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* gate */
#gate{position:fixed;inset:0;z-index:200;background:#07080b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#gate.hidden{display:none}
#gate .gbtn{background:none;border:1px solid #3a3226;color:#cdbf9f;font-family:var(--display);letter-spacing:.22em;text-transform:uppercase;font-size:15px;padding:12px 26px;border-radius:6px}
#gate .gbtn:hover{border-color:var(--brass);color:var(--brass)}
#gate .gsub{color:#4a4f58;font-size:12px;letter-spacing:.08em}
#gate .glink{background:none;border:0;color:#4a4f58;font-size:12px;text-decoration:underline;padding:4px}
/* cutscene */
#cut{position:fixed;inset:0;z-index:150;background:#05060a;display:none;align-items:center;justify-content:center}
#cut.show{display:flex}
.cstage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;max-height:100vh;overflow:hidden;background:#000;cursor:pointer}
@media (max-width:700px){.cstage{width:100vw;height:100vh;aspect-ratio:auto}}
.cbg{position:absolute;inset:-6%;background-size:cover;background-position:center;transition:opacity 1s ease;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
.ctint{position:absolute;inset:0;transition:background 1.2s ease;pointer-events:none}
.cvig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.75) 100%);pointer-events:none}
.cfx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.cblack{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s ease;pointer-events:none}
.cblack.on{opacity:1}
.ctitle{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:Cinzel,serif;font-weight:700;color:#efe4c8;font-size:clamp(22px,4.2vw,46px);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.9);opacity:0;transition:opacity .9s ease;padding:0 20px;pointer-events:none}
.ctitle.on{opacity:1}
.cbox{position:absolute;left:4%;right:4%;bottom:5%;background:rgba(10,12,24,.82);border:1px solid rgba(214,196,150,.35);border-radius:6px;padding:16px 22px 18px;min-height:84px;opacity:0;transition:opacity .4s ease;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.cbox.on{opacity:1}
.cbox .who{position:absolute;top:-13px;left:18px;background:#1b1a14;border:1px solid rgba(214,196,150,.45);color:var(--brass);font-family:Cinzel,serif;font-size:12px;letter-spacing:.14em;padding:3px 10px;border-radius:4px;text-transform:uppercase}
.cbox .txt{font-size:clamp(15px,1.8vw,20px);line-height:1.5;color:#efe8d8;text-align:center}
.cbox .txt.nar{font-style:italic}
.cbox .more{position:absolute;right:12px;bottom:8px;color:rgba(214,196,150,.6);font-size:11px;animation:blink 1.4s ease infinite}
.ctag{position:absolute;top:12px;left:12px;font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#cdbf9f;background:rgba(0,0,0,.55);border:1px solid rgba(214,196,150,.3);padding:4px 9px;border-radius:4px;z-index:3}

<script>
'use strict';
const APP_VERSION = '2.0';

/* ================= Regions ================= */
const REG = {
  cardio:{name:'Cardiovascular',land:'The Cardiac Heartland',match:['cardio']},
  pulm:{name:'Pulmonary & Critical Care',land:'The Bronchial Forest',match:['pulmonary']},
  renal:{name:'Renal, GU & Electrolytes',land:'The Renal Basin',match:['renal','male repro']},
  neuro:{name:'Nervous System',land:'The Neural Peaks',match:['nervous']},
  endo:{name:'Endocrine & Metabolism',land:'The Endocrine Mesas',match:['endocrine']},
  heme:{name:'Hematology & Oncology',land:'The Crimson Marrowlands',match:['hematology','female repro']},
  id:{name:'Infectious Diseases',land:'The Fever Marshes',match:['infectious']},
  gi:{name:'GI & Nutrition',land:'The GI Delta',match:['gastro']},
  rheum:{name:'Rheumatology & MSK',land:'The Joint Badlands',match:['rheumat']},
  gen:{name:'Biostats, Ethics & General',land:'The Capital District',match:['biostat','social','misc','general','pregnancy']},
  derm:{name:'Dermatology',land:'The Outer Coast',match:['dermat']},
  psych:{name:'Psychiatry & Behavioral',land:'The Mist Coast',match:['psychiat']},
  eye:{name:'ENT & Ophthalmology',land:'The Sensory Isles',match:['ear, nose','ent','ophthal']},
  tox:{name:'Poisoning & Environmental',land:'The Toxic Fens',match:['poison']},
  allergy:{name:'Allergy & Immunology',land:'The Immune Isles',match:['allergy']},
};
function sysToReg(sys){
  const s=(sys||'').toLowerCase().trim();
  for(const [id,r] of Object.entries(REG)) if(r.match.some(m=>s.startsWith(m))) return id;
  return null;
}
const EXACT_COUNTS = {cardio:171, pulm:122, id:114, gi:106, renal:106, neuro:95, heme:92, endo:87, rheum:71, gen:45, derm:24, psych:19, eye:19, tox:15, allergy:6};

const DEFAULT_SETTINGS = () => ({
  updatedAt: 0,
  start: '2026-10-27',
  campaignStart: '2026-11-02',
  imStart: '2026-11-09',
  shelf: '2026-12-18',
  sysCounts: {...EXACT_COUNTS},
  countsExact: true,
  ambossTotal: 1687,
  targetPct: 65,
  ankiGoal: 250,
  backlogAt: 700,
  clearBy: '2026-11-07',
  ankiDeck: 'AnKing*',
  defenseQ: 20,
  offDays: [],
  cms: {1:'2026-11-14', 2:'2026-11-29', 3:'2026-12-08', 4:'2026-12-14'},
});

/* ================= Utilities ================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const fmtD = s => parseD(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDow = s => parseD(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } h^=h>>>13; h=Math.imul(h,0x5bd1e995); h^=h>>>15; return (h>>>0)/4294967296; }
const r1 = x => Math.round(x*10)/10;

/* ================= State & storage ================= */
const LS_STATE='imc.state', LS_SYNC='imc.sync', LS_DEV='imc.device', LS_ANKI='imc.ankiAuto', LS_REP='imc.reportSeen', LS_ARROWS='imc.arrows';
let device = localStorage.getItem(LS_DEV);
if(!device){ device = Math.random().toString(36).slice(2,7); localStorage.setItem(LS_DEV,device); }
const uid = () => Date.now().toString(36)+'-'+device+Math.random().toString(36).slice(2,5);
function freshState(){ return {v:1, settings:DEFAULT_SETTINGS(), events:[]}; }
let S;
try { S = JSON.parse(localStorage.getItem(LS_STATE)) || freshState(); } catch(e){ S = freshState(); }
S.settings = Object.assign(DEFAULT_SETTINGS(), S.settings||{});
S.events = S.events || [];
function saveLocal(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(S)); }catch(e){} }
function touchSettings(){ S.settings.updatedAt = Date.now(); commit(); }
function addEvent(e){
  e.id = e.id || uid(); e.date = e.date || today();
  const i = S.events.findIndex(x=>x.id===e.id);
  const now = Math.max(Date.now(), lastTs+1); lastTs = now;
  e.ord = (i>=0 && S.events[i].ord) ? S.events[i].ord : (e.ord || now);
  e.ts = now;
  if(i>=0) S.events[i]=e; else S.events.push(e);
  commit(); return e;
}
let lastTs=0;
function removeEvent(id){ addEvent({id:'del-'+id, type:'del', target:id}); }
function commit(){ saveLocal(); render(); scheduleSync(); }
function mergeStates(a,b){
  if(!b) return a; if(!a) return b;
  const m = new Map();
  [...(a.events||[]), ...(b.events||[])].forEach(e=>{ const p=m.get(e.id); if(!p || e.ts>p.ts) m.set(e.id,e); });
  const sa=a.settings||{}, sb=b.settings||{};
  const settings = Object.assign(DEFAULT_SETTINGS(), (sb.updatedAt||0)>(sa.updatedAt||0) ? sb : sa);
  return {v:1, settings, events:[...m.values()].sort((x,y)=>x.ts-y.ts)};
}
const uwTotal = st => Object.values(st.settings.sysCounts).reduce((a,b)=>a+b,0);

/* ================= Map data ================= */
let MAP=null, T=null, HOME=null;   // T: towns by id
async function loadMap(){
  const r = await fetch('map.json', {cache:'no-cache'});
  MAP = await r.json();
  T = MAP.towns;
  T.forEach(t=>{ t.nset=new Set(t.n); });
  HOME = T.find(t=>t.r==='gen' && t.cap) || T.find(t=>t.r==='gen');
}

/* ================= Campaign engine =================
   Replays every event day by day from campaignStart, so all devices agree.
   Work sets how far you advance; accuracy sets how well you hold ground. */
function effOf(acc){ return acc<0.37?0 : acc<0.5?0.8 : acc<0.65?1.0 : acc<0.75?1.15 : 1.3; }
function effLabel(acc){ return acc<0.37?'Counterattack':acc<0.5?'×0.8':acc<0.65?'×1.0':acc<0.75?'×1.15':'×1.3'; }

function liveEvents(st){
  const dead = new Set(st.events.filter(e=>e.type==='del').map(e=>e.target));
  return st.events.filter(e=>e.type!=='del' && !dead.has(e.id)).sort((a,b)=>(a.ord||a.ts)-(b.ord||b.ts));
}

function simulate(st, extra){
  const set = st.settings, start = set.campaignStart, tday = today();
  const evs = liveEvents(st); if(extra) evs.push(extra);
  const byDay = {};
  let preAnki=null;
  for(const e of evs){
    if(e.date < start && e.type==='anki'){ if(!preAnki || e.date>=preAnki.date) preAnki=e; continue; }
    const d = e.date < start ? start : e.date; (byDay[d] ||= []).push(e);
  }
  const names = {}; evs.filter(e=>e.type==='rename').forEach(e=>{ names[e.town]=e.name; });
  const town = T.map(t=>({id:t.id, owner:'enemy', status:'enemy', prog:0, capDay:null, consAt:null, lostDay:null}));
  town[HOME.id].owner='us'; town[HOME.id].status='held'; town[HOME.id].capDay=start;
  const G = {town, target:null, reserve:0, uwDone:0, ambDone:0, log:[], days:{}, regAcc:{}, lastBeach:null,
             anki:null, ankiByDay:{}, missStreak:0, siege:false, siegeStart:null, inflow:0, inflows:[], blocks:[], cmsDone:{}, attacks:{}, names, sourceOf:null};
  const isUs = id => town[id].owner==='us';
  const attackable = id => town[id].owner==='enemy' && T[id].n.some(isUs);
  const add = (d,kind,html,extra) => G.log.push({d,kind,html,...(extra||{})});
  const tname = id => G.names[id] || T[id].name;
  if(preAnki){ G.anki=preAnki; if(preAnki.due > set.backlogAt){ G.siege=true; G.siegeStart=start; add(start,'siege',`Backlog carried in: <b class="c-bad">${preAnki.due.toLocaleString()}</b> AnKing cards due (last read ${fmtD(preAnki.date)}). Siege — clear to 0.`); } }

  function capture(id, d, lowAcc){
    const x=town[id]; x.owner='us'; x.status='occupied'; x.prog=0; x.capDay=d; x.consAt=addDays(d, lowAcc?10:7); x.lostDay=null;
    add(d,'cap',`<b class="c-us">${esc(tname(id))}</b> taken${T[id].cap?' — regional capital':''} (${REG[T[id].r].land}).`,{town:id});
    if(G.target===id) G.target=null;
  }
  function addGround(g, d, lowAcc){
    if(g<=0) return 0;
    const earned=g;
    if(G.target==null || town[G.target].owner==='us'){ G.reserve+=g; return earned; }
    g += G.reserve; G.reserve=0;
    const x=town[G.target], cost=T[G.target].cost;
    x.prog += g;
    if(x.prog >= cost){ const over=x.prog-cost; capture(G.target,d,lowAcc); G.reserve += over; }
    return earned;
  }
  function loseTown(id,d,why){
    const x=town[id]; x.owner='enemy'; x.status='lost'; x.prog=0; x.capDay=null; x.consAt=null; x.lostDay=d;
    add(d,'lost',`<b class="c-bad">${esc(tname(id))}</b> lost — ${why}.`,{town:id});
  }
  function applyLoss(g, d, why, allowHeld){
    let lost=0, towns=0;
    if(G.target!=null && town[G.target].prog>0){ const t=Math.min(g, town[G.target].prog); town[G.target].prog-=t; g-=t; lost+=t; }
    if(g>0 && G.reserve>0){ const t=Math.min(g,G.reserve); G.reserve-=t; g-=t; lost+=t; }
    const pool = () => town.filter(x=>x.owner==='us' && x.id!==HOME.id && (x.status==='occupied' || allowHeld) && T[x.id].n.some(n=>town[n].owner==='enemy'))
                       .sort((a,b)=>(a.status===b.status?0:a.status==='occupied'?-1:1) || (b.capDay||'').localeCompare(a.capDay||''));
    while(g>0 && towns<2){
      const c = pool()[0]; if(!c) break;
      const cost=T[c.id].cost; if(g < cost*0.4) break;
      loseTown(c.id,d,why); g-=cost; lost+=cost; towns++;
    }
    return {lost, towns};
  }
  function frontier(){ return town.filter(x=>x.owner==='us' && x.id!==HOME.id && T[x.id].n.some(n=>town[n].owner==='enemy')); }

  // weekly enemy offensive plan
  function attackDaysOfWeek(monday){
    const r = hash('wk'+monday); const c = r<0.3?1 : r<0.8?2 : 3;
    const days=[]; let k=0;
    while(days.length<c && k<40){ const di=Math.floor(hash('wd'+monday+'-'+k)*6); const d=addDays(monday,di); if(!days.includes(d)) days.push(d); k++; }
    return days;
  }
  const mondayOf = d => { const dt=parseD(d); const dow=(dt.getDay()+6)%7; return addDays(d,-dow); };
  function pickAttackTarget(d){
    const fr = frontier(); if(fr.length===0) return null;
    const w = fr.map(x=>{ const ra=G.regAcc[T[x.id].r]; let wt=1; if(ra && ra.n>=5) wt += Math.max(0,(set.targetPct/100 - ra.c/ra.n))*8; return wt; });
    const tot=w.reduce((a,b)=>a+b,0); let r=hash('atk'+d)*tot;
    for(let i=0;i<fr.length;i++){ r-=w[i]; if(r<=0) return fr[i].id; }
    return fr[fr.length-1].id;
  }

  // Daily review goal during a siege:
  //   (cards reviewed today + due right now + cards already scheduled for the remaining days) ÷ days left
  // "Already scheduled" comes from Anki (prop:due=1..n), so it rises when cards are failed or new ones unlocked.
  function siegeGoal(d){
    const snap=G.ankiByDay[d];
    let by = set.clearBy && set.clearBy>=d ? set.clearBy : null;
    if(!by){ const s0=G.siegeStart||d; by=addDays(s0,5); if(by<d) by=addDays(d,1); }
    const left=Math.max(1, daysBetween(d,by)+1);
    const reviewed = snap ? snap.reviewed : 0;
    const dueNow = snap ? snap.due : (G.anki ? G.anki.due : 0);
    let incoming=0, method='even';
    if(snap && Array.isArray(snap.fut) && snap.fut.length){
      for(let i=0;i<left-1;i++) incoming += (snap.fut[i] ?? snap.fut[snap.fut.length-1] ?? 0);
      method='forecast';
    } else if(G.inflow){ incoming = Math.round(G.inflow*(left-1)); method='estimate'; }
    const W = reviewed + dueNow + incoming;
    // forecasts run a little low: cards failed along the way come back. Pad by the observed "Again" rate.
    // Blend an 8% starting guess with the measured rate, so the goal eases toward reality instead of jumping.
    const ref = (snap && snap.again!=null && snap.reviewed>0) ? snap : (G.lapseRef || null);
    const measured = ref ? ref.again/ref.reviewed : null;
    const lapse = ref ? Math.max(0.03, Math.min(0.3, (0.08*100 + ref.again)/(100 + ref.reviewed))) : 0.08;
    // only cards still ahead of you can come back failed; cards already reviewed today are counted once
    const remaining = dueNow + incoming;
    return {goal: Math.max(set.ankiGoal, Math.ceil((reviewed + remaining*(1+lapse))/left)), by, B:reviewed+dueNow, incoming, left, method, lapse, measured,
            tomorrow: snap && Array.isArray(snap.fut) ? (snap.fut[0]||0) : null,
            need: Math.ceil((reviewed+dueNow)/left)};
  }
  const dayList=[]; for(let d=start; d<=tday; d=addDays(d,1)) dayList.push(d);
  for(const d of dayList){
    const R = G.days[d] = {d, quota:0, q:0, c:0, uw:0, amb:0, gained:0, lostGround:0, caps:[], losses:[], cons:[], attack:null, def:null, anki:null, goalMet:null, leave:set.offDays.includes(d), momentum:false, backlog:false};
    const logStart = G.log.length;
    // start of day: consolidation
    for(const x of town){ if(x.status==='occupied' && x.consAt && d>=x.consAt){ x.status='held'; R.cons.push(x.id); add(d,'cons',`${esc(tname(x.id))} consolidated — now solid.`,{town:x.id}); } }
    // quota
    const remUW = Math.max(0, uwTotal(st) - G.uwDone);
    let sd=0; for(let x=d; x<set.shelf; x=addDays(x,1)) if(!set.offDays.includes(x)) sd++;
    // siege state from the last known Anki reading (carries over from before the campaign)
    if(!G.siege && G.anki && G.anki.due > set.backlogAt){ G.siege=true; G.siegeStart=d; }
    R.siege = G.siege;
    R.quota = (R.leave || d>=set.shelf || R.siege) ? 0 : Math.ceil(remUW/Math.max(1,sd));
    // momentum: goal met on >=5 of last 7 completed days (proportional early on)
    let met=0, cnt=0; for(let i=1;i<=7;i++){ const pd=addDays(d,-i); const pr=G.days[pd]; if(!pr) continue; cnt++; if(pr.goalMet) met++; }
    R.momentum = cnt>=3 && met/cnt >= 5/7;
    // enemy offensive
    const ours = town.filter(x=>x.owner==='us').length;
    if(!R.leave && ours>=3 && daysBetween(start,d)>=3 && attackDaysOfWeek(mondayOf(d)).includes(d)){
      const tid = pickAttackTarget(d);
      if(tid!=null){ R.attack=tid; G.attacks[d]=tid; add(d,'atk',`Enemy offensive against <b class="c-bad">${esc(tname(tid))}</b>. Defend with your first ${set.defenseQ} questions.`,{town:tid}); }
    }
    let defLeft = R.attack!=null ? set.defenseQ : 0, defN=0, defC=0;
    // events
    for(const e of (byDay[d]||[])){
      if(e.type==='front'){
        const id=e.target; if(id==null || !town[id] || town[id].owner==='us') continue;
        const adj = attackable(id);
        const beachOk = !G.lastBeach || daysBetween(G.lastBeach,d)>=7;
        if(adj || beachOk){
          if(!adj) G.lastBeach=d;
          G.target=id;
          const src = T[id].n.filter(isUs).sort((a,b)=>Math.hypot(T[a].x-T[id].x,T[a].y-T[id].y)-Math.hypot(T[b].x-T[id].x,T[b].y-T[id].y))[0];
          G.sourceOf = src ?? null;
          add(d,'front',`Offensive ordered on <b>${esc(tname(id))}</b>${adj?'':' (beachhead landing)'}.`,{town:id});
          if(G.reserve>0){ const rs=G.reserve; G.reserve=0; G.reserve=0; const before=R.gained; addGround(rs,d,false); R.gained=before; }
        }
      } else if(e.type==='block' || e.type==='cms'){
        const n = e.type==='cms'?50:e.n, c = e.type==='cms'?Math.round(e.pct/2):e.c;
        if(!(n>0)) continue;
        const acc = c/n;
        R.q+=n; R.c+=c;
        if(e.type==='block' && e.src==='uw'){ G.uwDone+=n; R.uw+=n; } else { G.ambDone+=n; R.amb+=n; }
        if(e.type==='cms') G.cmsDone[e.form]=e;
        // intel from tagged questions
        if(e.tags && e.q){ e.tags.forEach((tg,i)=>{ const rg=tg.r; if(!rg || e.q[i]==null || i>=n) return; const ra=G.regAcc[rg] ||= {n:0,c:0,cats:{}}; ra.n++; ra.c+=e.q[i]?1:0; const ck=tg.cat||'?'; const cc=ra.cats[ck] ||= {n:0,c:0}; cc.n++; cc.c+=e.q[i]?1:0; }); }
        let nOff=n;
        if(defLeft>0){ const dq=Math.min(n,defLeft); defLeft-=dq; defN+=dq; defC+=c*dq/n; nOff=n-dq; }
        let ground=0, lossInfo=null;
        if(nOff>0){
          if(acc<0.37){
            lossInfo = applyLoss(0.3*nOff, d, 'enemy counterattack after a rough block', false);
            R.lostGround += lossInfo.lost;
          } else {
            let mult = effOf(acc) * (R.momentum?1.15:1) * (G.siege?0.5:1);
            let bt = 0;
            if(e.tags && G.target!=null){ const tr=T[G.target].r; const hits=e.tags.filter(tg=>tg.r===tr).length; bt = hits/e.tags.length; }
            ground = nOff * mult * (1 + 0.5*bt);
            const tBefore = G.target;
            R.gained += addGround(ground, d, acc<0.5);
            if(tBefore!=null && town[tBefore].owner==='us') R.caps.push(tBefore);
          }
        }
        G.blocks.push({e, d, n, c, acc, ground, lossInfo, def: n-nOff});
      } else if(e.type==='anki'){
        G.ankiByDay[d]=e; G.anki=e; if(e.again!=null && e.reviewed>=30) G.lapseRef=e;
        if(!G.siege && e.due > set.backlogAt){ G.siege=true; G.siegeStart=d; add(d,'siege',`Backlog: <b class="c-bad">${e.due.toLocaleString()}</b> AnKing cards due. Siege begins — clear to 0.`); }
        else if(G.siege && e.due===0){ G.siege=false; R.siegeBroken=true; add(d,'siege',`<b class="c-good">Siege broken!</b> AnKing at 0 due. Bonus ground, and towns resume consolidating.`); R.gained += addGround(15, d, false); }
      }
    }
    if(defN>0) R.def={n:defN, c:defC};
    // end of day (only completed days)
    if(d<tday){
      R.anki = G.ankiByDay[d] || null;
      const prevSnap = G.ankiByDay[addDays(d,-1)];
      if(R.anki && prevSnap){ const inf=R.anki.reviewed+R.anki.due-prevSnap.due; if(inf>=0){ G.inflows.push(inf); G.inflows=G.inflows.slice(-4); G.inflow=G.inflows.reduce((a,b)=>a+b,0)/G.inflows.length; } }
      const sg = R.siege ? siegeGoal(d) : null;
      if(sg) R.ankiGoal = sg.goal;
      const rev0 = R.anki ? R.anki.reviewed : 0;
      R.goalMet = !!(R.leave || (R.siege ? (rev0 >= R.ankiGoal || (R.anki && R.anki.due===0) || R.siegeBroken) : R.q >= R.quota));
      // defense
      if(R.attack!=null){
        const tid=R.attack;
        if(town[tid].owner==='us'){
          if(defN >= set.defenseQ){
            const da = defC/defN;
            if(da < 0.5 && town[tid].status==='held'){ town[tid].status='occupied'; town[tid].consAt=addDays(d,7); add(d,'def',`${esc(tname(tid))} held, but shaken (defense at ${Math.round(da*100)}%). Back to striped.`,{town:tid}); }
            else add(d,'def',`Enemy repelled at <b class="c-good">${esc(tname(tid))}</b>.`,{town:tid});
            R.defOutcome='held';
          } else { loseTown(tid,d,`defense not completed (${Math.round(defN)}/${set.defenseQ})`); R.losses.push(tid); R.defOutcome='lost'; }
        }
      }
      // missed goal → enemy push (question days)
      if(!R.goalMet && R.siege){ G.missStreak++; }
      else if(!R.goalMet){
        G.missStreak++;
        const deficit = R.quota - R.q;
        const mult = Math.min(3, 1 + 0.5*(G.missStreak-1));
        const li = applyLoss(deficit*0.5*mult, d, R.q===0?'no work reported':'daily goal missed', G.missStreak>=2);
        R.lostGround += li.lost;
        add(d,'miss',`Goal missed (${R.q}/${R.quota}). Enemy pushed back ${r1(li.lost)} ground${li.towns?`, ${li.towns} town${li.towns>1?'s':''} lost`:''}.`);
      } else if(!R.leave) G.missStreak=0;
      // Anki supply lines
      R.backlog = R.siege && G.siege;
      if(G.siege){
        for(const x of town) if(x.status==='occupied' && x.consAt) x.consAt = addDays(x.consAt,1); // consolidation frozen
        if(R.siege && !R.goalMet){
          const occ = town.filter(x=>x.status==='occupied' && x.id!==HOME.id).sort((a,b)=>(b.capDay||'').localeCompare(a.capDay||''))[0];
          if(occ){ loseTown(occ.id,d,`siege goal missed (${rev0}/${R.ankiGoal} reviews)`); R.losses.push(occ.id); }
          else add(d,'supply',`Siege goal missed: ${rev0}/${R.ankiGoal} reviews.`);
        }
      }
    }
    R.logFrom = logStart; R.logTo = G.log.length;
  }
  // final derived
  const snap = G.anki;
  G.ankiDue = snap ? snap.due : null;
  G.backlog = G.siege;
  G.today = G.days[tday];
  if(G.today && G.siege){ const sg=siegeGoal(tday); G.today.ankiGoal=sg.goal; G.siegeBy=sg.by; G.siegeB=sg.B; G.siegeInfo=sg; }
  if(G.today && !G.today.ankiGoal) G.today.ankiGoal=set.ankiGoal;
  G.remainingUW = Math.max(0, uwTotal(st) - G.uwDone);
  G.attackable = id => attackable(id);
  G.beachOk = !G.lastBeach || daysBetween(G.lastBeach,tday)>=7;
  G.tname = tname;
  return G;
}

function townFill(x){

}
function regionCentroids(){
  const c={}; for(const t of T){ const a=c[t.r] ||= {x:0,y:0,n:0,w:0}; const w=t.cost; a.x+=t.x*w; a.y+=t.y*w; a.w+=w; }
  for(const k in c){ c[k].x/=c[k].w; c[k].y/=c[k].w; } return c;
}
let RC=null;
function updateMap(){
  const svg=$('#mapsvg'); if(!svg) return;
  const td=G.today||{};
  const cands = pickMode ? new Set(T.filter(t=>G.town[t.id].owner==='enemy' && (G.attackable(t.id) || G.beachOk)).map(t=>t.id)) : null;

    if(t.cap) mk+=`<g class="marker" transform="translate(${t.x},${t.y})"><rect x="${-s}" y="${-s}" width="${2*s}" height="${2*s}" transform="rotate(45)" fill="${col}" stroke="#f4ead2" stroke-width="${1.4/Math.sqrt(z)}"/></g>`;
    else mk+=`<circle class="marker" cx="${t.x}" cy="${t.y}" r="${s}" fill="${col}" stroke="#f4ead2" stroke-width="${1.1/Math.sqrt(z)}"/>`;
    if(G.target===t.id){ const pr=x.prog/t.cost; const R=s+4/Math.sqrt(z), C=2*Math.PI*R; mk+=`<circle class="marker" cx="${t.x}" cy="${t.y}" r="${R}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="${3/Math.sqrt(z)}"/><circle class="marker" cx="${t.x}" cy="${t.y}" r="${R}" fill="none" stroke="#ffb347" stroke-width="${3/Math.sqrt(z)}" stroke-dasharray="${C*pr} ${C}" transform="rotate(-90 ${t.x} ${t.y})"/>`; }
    const showLbl = t.cap ? z>=1.4 : z>=2.6;
    if(showLbl || G.target===t.id || selTown===t.id || td.attack===t.id){ const fs=(t.cap?13:11)/Math.sqrt(z)*(z<2?1.1:1); lb+=`<text class="lbl" x="${t.x}" y="${t.y - s - 4/Math.sqrt(z)}" text-anchor="middle" font-size="${fs}" stroke-width="${3/Math.sqrt(z)}">${esc(G.tname(t.id))}</text>`; }
  }
  if(z<2.2){ RC ||= regionCentroids(); for(const r of MAP.regs){ const c=RC[r]; const big=['allergy','tox','eye','psych','derm'].includes(r)?0.75:1; const fs=15*big/Math.sqrt(z); lb+=`<text class="rlbl" x="${c.x}" y="${c.y+18/Math.sqrt(z)}" text-anchor="middle" font-size="${fs}" stroke-width="${3.5/Math.sqrt(z)}">${esc(REG[r].land.replace(/^The /,''))}</text>`; } }
  $('#gmarkers').innerHTML=mk; $('#glabels').innerHTML=lb;
  // arrows
  let ar='';
  if(showArrows){
    if(G.target!=null){ const src = G.sourceOf!=null && G.town[G.sourceOf].owner==='us' ? G.sourceOf : nearestOurs(G.target); if(src!=null) ar+=arrowPath(T[src],T[G.target],false,z); }
    if(td.attack!=null && G.town[td.attack].owner==='us'){ const e=T[td.attack].n.filter(n=>G.town[n].owner==='enemy').sort((a,b)=>dist(a,td.attack)-dist(b,td.attack))[0]; if(e!=null) ar+=arrowPath(T[e],T[td.attack],true,z); }
  }
  $('#garrows').innerHTML=ar;
  const ab=$('#arrowbtn'); if(ab) ab.classList.toggle('on',showArrows);
  $('#maphint')?.classList.toggle('show',pickMode);
}
const dist=(a,b)=>Math.hypot(T[a].x-T[b].x,T[a].y-T[b].y);
function nearestOurs(id){ const c=T[id].n.filter(n=>G.town[n].owner==='us'); const pool=c.length?c:T.filter(t=>G.town[t.id].owner==='us').map(t=>t.id); return pool.sort((a,b)=>dist(a,id)-dist(b,id))[0]; }
function arrowPath(a,b,enemy,z){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  const sx=a.x+dx/L*10, sy=a.y+dy/L*10, ex=b.x-dx/L*14, ey=b.y-dy/L*14;
  const mx=(sx+ex)/2 - dy/L*L*0.18, my=(sy+ey)/2 + dx/L*L*0.18;
  return `<path class="arrow ${enemy?'enemy':''}" d="M${sx},${sy} Q${mx},${my} ${ex},${ey}" stroke-width="${6/Math.sqrt(z)}" marker-end="url(#${enemy?'ahr':'ah'})"/>`;
}

/* ---------- Pan / zoom ---------- */
let VB=null;
function zoomLevel(){ return VB ? MAP.w/VB.w : 1; }
function elAspect(){ const el=$('#mapsvg'); if(!el) return MAP.h/MAP.w; const r=el.getBoundingClientRect(); return r.width>0 ? r.height/r.width : MAP.h/MAP.w; }
function setVB(v){
  const W=MAP.w,H=MAP.h, minW=W/7, asp=elAspect(), maxW=Math.min(W, H/asp);
  v.w=Math.max(minW,Math.min(maxW,v.w)); v.h=v.w*asp;
  if(v.h>H){ v.h=H; }
  v.x=Math.max(0,Math.min(W-v.w,v.x)); v.y=Math.max(0,Math.min(H-v.h,v.y));
  VB=v; const svg=$('#mapsvg'); if(svg) svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);
}
function svgPoint(svg,cx,cy){ const r=svg.getBoundingClientRect(); const sc=Math.max(VB.w/r.width, VB.h/r.height); const ox=(r.width*sc-VB.w)/2, oy=(r.height*sc-VB.h)/2; return {x:VB.x+(cx-r.left)*sc-ox, y:VB.y+(cy-r.top)*sc-oy, sc}; }
function zoomAt(f,cx,cy){
  const svg=$('#mapsvg'); const p=svgPoint(svg,cx,cy); const nw=VB.w/f;
  const kx=(p.x-VB.x)/VB.w, ky=(p.y-VB.y)/VB.h;
  setVB({x:p.x-kx*nw, y:p.y-ky*nw*elAspect(), w:nw}); scheduleMarkers();
}
let mkT=null; function scheduleMarkers(){ clearTimeout(mkT); mkT=setTimeout(updateMap,60); }
function zoomTo(x,y,w){ setVB({x:x-w/2,y:y-w*elAspect()/2,w}); updateMap(); }
function bindMap(){
  const svg=$('#mapsvg'); if(!svg || svg.dataset.bound) return; svg.dataset.bound=1;
  if(!VB){ const maxW=Math.min(MAP.w, MAP.h/elAspect()); const c=T[HOME.id]; VB={x:c.x-maxW/2, y:c.y-maxW*elAspect()/2, w:maxW}; }
  setVB({...VB});
  const ptrs=new Map(); let moved=0, last=null, pinch=null;
  svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0016), e.clientX, e.clientY); },{passive:false});
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; last={x:e.clientX,y:e.clientY};
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; } });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2 && pinch){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch.d>0){ zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); } pinch.d=d; moved+=10; return; }
    if(ptrs.size===1 && last){ const dx=e.clientX-last.x, dy=e.clientY-last.y; moved+=Math.abs(dx)+Math.abs(dy);
      if(moved>4){ svg.classList.add('dragging'); const r=svg.getBoundingClientRect(); const sc=Math.max(VB.w/r.width,VB.h/r.height); setVB({x:VB.x-dx*sc,y:VB.y-dy*sc,w:VB.w}); }
      last={x:e.clientX,y:e.clientY}; }
  });
  const up=e=>{ const wasTap = ptrs.size===1 && moved<=4; ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; svg.classList.remove('dragging');
    if(wasTap){ const el=document.elementFromPoint(e.clientX,e.clientY); const g=el && el.closest && el.closest('.town'); if(g) onTownTap(+g.dataset.t); }
    if(ptrs.size===0) last=null; };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null;});
}
function onTownTap(id){
  if(pickMode){
    const x=G.town[id];
    if(x.owner==='us'){ toast('That town is already yours. Pick an enemy town.'); return; }
    const adj=G.attackable(id);
    if(!adj && !G.beachOk){ toast('Not adjacent to your territory. Beachhead landings: once a week.'); return; }
    pickMode=false; selTown=null;
    addEvent({type:'front', target:id});
    toast(`Offensive ordered: ${G.tname(id)}${adj?'':' (beachhead)'}.`);
    return;
  }
  selTown=id; updateMap(); openTown(id);
}

// Net = reviews done today − estimated cards due tomorrow (scheduled × failed-card buffer).
function ankiNet(snap, lapse){
  if(!snap || !Array.isArray(snap.fut) || snap.fut[0]==null) return null;
  const est = Math.round(snap.fut[0]*(1+(lapse??0.08)));
  return {did:snap.reviewed, est, net:snap.reviewed-est};
}
function netHtml(n, need){
  if(!n) return '';
  const cls = n.net>=0 ? 'c-good' : 'c-bad';
  return `<span class="pill ${cls}" title="Reviews done today minus estimated cards due tomorrow">${n.net>=0?'Surplus +':'Deficit −'}${Math.abs(n.net).toLocaleString()}</span>
    <span class="note">${n.did.toLocaleString()} done − ~${n.est.toLocaleString()} due tomorrow${need!=null?` · on pace needs <b class="${n.net>=need?'c-good':'c-warn'}">+${need.toLocaleString()}</b>/day`:''}</span>`;
}
function habitVal(d,k){ const e=liveEvents(S).filter(e=>e.type==='habit' && e.date===d && e.kind===k).pop(); return e?e.val:undefined; }
function agoText(ts){ const m=Math.round((Date.now()-ts)/60000); if(m<1) return 'just now'; if(m<60) return m+'m ago'; const h=Math.round(m/60); if(h<24) return h+'h ago'; return Math.round(h/24)+'d ago'; }

function weekMonday(d){ const dt=parseD(d); const dow=(dt.getDay()+6)%7; return addDays(d,-dow); }
function spark(vals, w=150, h=34){
  const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null); if(pts.length<2) return '';
  const mx=Math.max(...pts.map(p=>p[1]),1), n=vals.length-1||1;
  const xy=pts.map(([i,v])=>`${(i/n*(w-6)+3).toFixed(1)},${(h-3-(v/mx)*(h-8)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Due cards trend"><polyline points="${xy}" fill="none" stroke="#e0705f" stroke-width="2"/>${pts.map(([i,v])=>`<circle cx="${(i/n*(w-6)+3).toFixed(1)}" cy="${(h-3-(v/mx)*(h-8)).toFixed(1)}" r="2.2" fill="#e0705f"/>`).join('')}</svg>`;
}

/* ---- Log sheet: quick numbers or paste ---- */
let LD=null;
function openLog(attachTo){
  const ids = attachTo ? (Array.isArray(attachTo)?attachTo:[attachTo]) : null;
  LD={mode: ids?'paste':'quick', src:'uw', attachTo:ids, rows:null, score:null, date:today()};
  drawLog();
}
function drawLog(){
  const d=LD, att=attachedOp();
  let body='';
  if(d.mode==='quick'){
    body=`<div class="field"><label>Source</label><div class="seg"><button data-ls="uw" class="${d.src==='uw'?'on':''}">UWorld</button><button data-ls="amboss" class="${d.src==='amboss'?'on':''}">AMBOSS</button></div></div>
      <div class="pair"><div class="field"><label>Questions</label><input type="number" inputmode="numeric" id="lg-n" placeholder="40"></div><div class="field"><label>Correct</label><input type="number" inputmode="numeric" id="lg-c" placeholder="26"></div></div>`;
  } else {
    body=`<div class="field"><label>Paste the UWorld results page</label><textarea id="lg-paste" placeholder="On the results page: Cmd+A, Cmd+C, then paste here">${d.raw?esc(d.raw):''}</textarea></div>
      ${d.rows?`<div class="note">${d.rows.length} questions found${d.score!=null?` · UWorld score ${d.score}% (${Math.round(d.score*d.rows.length/100)} correct)`:''}. ${att&&att.q.length===d.rows.length?'Your live taps are filled in.':att?(att.segs.length>1?`Your live count was ${att.n}; intel will be matched in order to the first ${Math.min(att.n,d.rows.length)}. Tap the ones you got wrong.`:`Your live count was ${att.n}; these ${d.rows.length} results will replace it. Tap the ones you got wrong.`):'Tap the ones you got wrong.'} Marked correct: <b id="lg-cnt">${d.rows.filter(r=>r.ok).length}</b></div>
        <div class="qrows">${d.rows.map((r,i)=>`<div class="qrow"><button class="${r.ok?'':'x'}" data-qi="${i}">${r.ok?'✓':'✗'}</button><div><div>${esc(r.cat||'')}</div><div class="t">${esc(r.topic||'')} · ${esc(r.sys||'')}</div></div><span class="t">${r.r?esc(REG[r.r].land.replace(/^The /,'')):''}</span></div>`).join('')}</div>`:''}`;
  }
  openSheet(`<h2>${att?'Add intel to '+esc(att.name||'operation'):'Report work'}</h2>
    <div class="note">${att?'Paste the results so the map knows which systems you hit.':'Use this when you did questions without live mode.'}</div>
    ${att?'':`<div class="field"><label>How</label><div class="seg"><button data-lm="quick" class="${d.mode==='quick'?'on':''}">Numbers</button><button data-lm="paste" class="${d.mode==='paste'?'on':''}">Paste UWorld results</button></div></div>`}
    ${att?'':`<div class="field"><label>Day</label><div class="seg"><button data-ld="${today()}" class="${d.date===today()?'on':''}">Today</button><button data-ld="${addDays(today(),-1)}" class="${d.date!==today()?'on':''}">Yesterday</button></div></div>`}
    ${body}
    <div class="actions"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="log-save">${att?'Add intel':'Send report'}</button></div>`);
  const ta=$('#lg-paste'); if(ta) ta.addEventListener('input',()=>{ LD.raw=ta.value; parsePaste(); });
}
function attachedOp(){
  if(!LD || !LD.attachTo) return null;
  const evs=liveEvents(S); const segs=LD.attachTo.map(id=>evs.find(e=>e.id===id)).filter(Boolean);
  if(!segs.length) return null;
  return {name:segs[0].name, n:segs.reduce((a,e)=>a+e.n,0), q:segs.flatMap(e=>e.q||[]), segs};
}
function parsePaste(){
  const txt=LD.raw||''; const rows=[];
  for(const line of txt.split(/\r?\n/)){
    const m=line.match(/^\s*(\d+)\s*-\s*(\d+)\t([^\t]*)\t([^\t]*)\t([^\t]*)\t([^\t]*)/);
    if(m) rows.push({num:+m[1], qid:m[2], subj:m[3].trim(), sys:m[4].trim(), cat:m[5].trim(), topic:m[6].trim(), r:sysToReg(m[4]), ok:true});
  }
  const sm=txt.match(/Your Score\s*([\d.]+)\s*%/i);
  LD.score = sm ? +sm[1] : null;
  rows.sort((a,b)=>a.num-b.num);
  const att = attachedOp();
  if(att && att.q.length===rows.length) rows.forEach((r,i)=>r.ok=!!att.q[i]);
  else if(LD.score!=null && rows.length){ // can't know which; default all correct, user marks misses
  }
  LD.rows = rows.length ? rows : null;
  const keep=LD.raw; drawLog(); const ta=$('#lg-paste'); if(ta){ ta.value=keep; }
}
function saveLog(){
  const d=LD;
  if(d.mode==='quick'){
    const n=+$('#lg-n').value, c=+$('#lg-c').value;
    if(!(n>0)) return toast('Enter how many questions.');
    if($('#lg-c').value==='' || c<0 || c>n) return toast('Correct must be between 0 and '+n+'.');
    const before=snapshotOwn();
    addEvent({type:'block', src:d.src, n, c, name:opName(), date:d.date});
    closeSheet(); afterReport(before, n, c);
  } else {
    if(!d.rows) return toast('Paste the results page first.');
    const q=d.rows.map(r=>r.ok?1:0), tags=d.rows.map(r=>({r:r.r, sys:r.sys, cat:r.cat, topic:r.topic}));
    const c=q.reduce((a,b)=>a+b,0);
    if(d.attachTo){
      const att=attachedOp();
      if(att){
        if(att.segs.length===1){ const e=att.segs[0]; addEvent({...e, tags, q, c, n:q.length}); }
        else { let i=0; for(const e of att.segs){ const sq=q.slice(i,i+e.n), st=tags.slice(i,i+e.n); i+=e.n; if(sq.length) addEvent({...e, tags:st, q:sq}); } }
      }
      closeSheet(); toast('Intel added. Systems hit are now on the map.');
    } else {
      const before=snapshotOwn();
      addEvent({type:'block', src:'uw', n:q.length, c, q, tags, name:opName(), date:d.date});
      closeSheet(); afterReport(before, q.length, c);
    }
  }
}
function snapshotOwn(){ return G.town.map(x=>x.owner+x.status); }
function afterReport(before,n,c){
  const now=G.town.map(x=>x.owner+x.status); const caps=[]; now.forEach((v,i)=>{ if(v!==before[i] && G.town[i].owner==='us') caps.push(i); });
  const acc=c/n;
  if(caps.length){ toast(`${caps.map(i=>G.tname(i)).join(', ')} taken!`); flashTowns(caps); }
  else toast(acc<0.37?`${Math.round(acc*100)}% — the enemy counterattacked.`:`${n} questions at ${Math.round(acc*100)}% (${effLabel(acc)}).`);
}
function flashTowns(ids){ if(tab!=='campaign') return; ids.forEach(id=>{ const g=document.querySelector(`.town[data-t="${id}"]`); if(g){ g.classList.add('flash'); setTimeout(()=>g.classList.remove('flash'),3000);} }); }

/* ================= Live operation ================= */
const OP_A=['Iron','Crimson','Silent','Northern','Broken','Rising','Hollow','Swift','Burning','Pale','Final','Steel','Thunder','Winter','Ashen','Midnight','Granite','Scarlet','Hidden','Vigilant','Black','Golden','Restless','Long'];
const OP_N=['Ventricle','Nephron','Alveolus','Lancet','Synapse','Marrow','Aorta','Sentinel','Bastion','Scalpel','Harbor','Hammer','Spear','Dawn','Tide','Vanguard','Bulwark','Gauntlet','Atrium','Glomerulus','Cortex','Pylorus','Hilum','Septum','Trident','Anvil','Lantern'];
function opName(){ return 'Operation '+OP_A[Math.floor(Math.random()*OP_A.length)]+' '+OP_N[Math.floor(Math.random()*OP_N.length)]; }
let OP=null;
function startOperation(){
  if(G.target==null && !(G.today && G.today.attack!=null && G.town[G.today.attack].owner==='us')){
    toast('Choose a target first.'); tab='campaign'; render(); pickMode=true; updateCampaign(); return;
  }
  if(G.backlog) toast('Siege active — questions earn half ground and add cards. Anki first.');
  OP={id:uid(), name:opName(), src:'uw', q:[], segs:[], startTarget:G.target, msg:'', base:{g:(G.today||{}).gained||0, l:(G.today||{}).lostGround||0}};
  OP.ownBefore=snapshotOwn();
  $('#op').classList.add('show'); drawOp(true);
}
function opEvent(){ const c=OP.q.reduce((a,b)=>a+b,0); const now=Math.max(Date.now(), lastTs+1); return {id:OP.id, type:'block', src:OP.src, n:OP.q.length, c, q:[...OP.q], name:OP.name, date:today(), ts:now, ord:now}; }
function cityDistricts(t){
  const k = t.cap ? 8 : (t.cost>=12 ? 6 : 5);
  return k;
}
function citySVG(t, prog, frac0){
  // radial city: k wedge districts around a keep, seeded per town
  const k=cityDistricts(t), cost=t.cost, per=cost/k;
  const seed=t.id*97+13, rnd=(i)=>hash('c'+seed+'-'+i);
  const cx=150, cy=150, r0=38, r1o=128, rot=rnd(0)*360;
  let s=`<svg class="op-city" viewBox="0 0 300 300"><defs><pattern id="opUs" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2c5a8c"/><rect width="3.5" height="8" fill="#4f8fd4"/></pattern></defs>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r1o+8}" fill="#1a1612" stroke="#4a3d2c" stroke-width="3"/>`;
  // river
  if(rnd(1)>0.45){ const a=rnd(2)*Math.PI; s+=`<path d="M${cx-Math.cos(a)*150},${cy-Math.sin(a)*150} Q${cx+(rnd(3)-.5)*80},${cy+(rnd(4)-.5)*80} ${cx+Math.cos(a)*150},${cy+Math.sin(a)*150}" stroke="#2c5566" stroke-width="9" fill="none" opacity=".8"/>`; }
  for(let i=0;i<k;i++){
    const a0=(rot+i*360/k)*Math.PI/180, a1=(rot+(i+1)*360/k)*Math.PI/180;
    const jit=(j)=>r1o-rnd(10+i*3+j)*18;
    const ro=jit(0), rm=jit(1);
    const p=(r,a)=>`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`;
    const am=(a0+a1)/2;
    const d=`M${p(r0,a0)} L${p(ro,a0)} Q${p(rm+6,am)} ${p(ro,a1)} L${p(r0,a1)} Z`;
    const filled = Math.max(0,Math.min(1,(prog - i*per)/per));
    const fill = filled>=0.999 ? 'url(#opUs)' : '#3a2e24';
    s+=`<path class="dist" id="dist${i}" d="${d}" fill="${fill}" stroke="#0e0b08" stroke-width="2"/>`;
    if(filled>0 && filled<0.999){ const rr=r0+(ro-r0)*filled; s+=`<path d="M${p(r0,a0)} L${p(rr,a0)} A${rr},${rr} 0 0 1 ${p(rr,a1)} L${p(r0,a1)} Z" fill="#ffb347" opacity=".55"/>`; }
    // buildings
    const nb=4+Math.floor(rnd(50+i)*5);
    for(let b=0;b<nb;b++){ const ab=a0+(a1-a0)*(0.15+0.7*rnd(60+i*9+b)); const rb=r0+12+(ro-r0-24)*rnd(70+i*9+b); const bx=cx+rb*Math.cos(ab), by=cy+rb*Math.sin(ab); const w=5+rnd(80+b)*7;
      s+=`<rect x="${(bx-w/2).toFixed(1)}" y="${(by-w/2).toFixed(1)}" width="${w.toFixed(1)}" height="${(w*0.8).toFixed(1)}" fill="${filled>=0.999?'#a9c8ea':'#8a7458'}" opacity=".75" transform="rotate(${(ab*180/Math.PI).toFixed(0)} ${bx.toFixed(1)} ${by.toFixed(1)})"/>`; }
  }
  const done = prog>=cost;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r0-4}" fill="${done?'#4f8fd4':'#5a3a2a'}" stroke="#0e0b08" stroke-width="3"/>`;
  s+=`<path d="M${cx-12},${cy+8} L${cx-12},${cy-6} L${cx-6},${cy-6} L${cx-6},${cy-12} L${cx+6},${cy-12} L${cx+6},${cy-6} L${cx+12},${cy-6} L${cx+12},${cy+8} Z" fill="${done?'#dceaff':'#d9c3a0'}"/>`;
  s+=`</svg>`;
  return s;
}
function drawOp(first){
  const set=S.settings;
  const Gs = simulate(S, OP.q.length? opEvent() : null);
  const td = Gs.today || {};
  const allQ=[...OP.segs.flatMap(sg=>sg.q), ...OP.q];
  const n=allQ.length, c=allQ.reduce((a,b)=>a+b,0), acc=n?c/n:null;
  // which town to draw: current target (or the one just captured in this op)
  let tid = Gs.target!=null ? Gs.target : (OP.startTarget!=null ? OP.startTarget : td.attack);
  const capturedNow = OP.startTarget!=null && Gs.town[OP.startTarget].owner==='us' && (OP.q.length>0 || G.town[OP.startTarget].owner!=='us');
  if(capturedNow) tid = OP.startTarget;
  const t = tid!=null ? T[tid] : HOME;
  const prog = capturedNow ? t.cost : (Gs.town[t.id] ? Gs.town[t.id].prog : 0);
  const defN = Gs.today && Gs.today.def ? Gs.today.def.n : 0;
  const inDef = td.attack!=null && G.town[td.attack].owner==='us' && defN < set.defenseQ;
  const gain = (Gs.today?Gs.today.gained:0) - OP.base.g;
  const lostG = (Gs.today?Gs.today.lostGround:0) - OP.base.l;
  let nextHtml='';
  if(capturedNow && Gs.target==null){
    const own=id=>Gs.town[id].owner==='us';

function opTap(ok){
  const prevCap = OP.q.length ? simulate(S, opEvent()).town.map(x=>x.owner) : G.town.map(x=>x.owner);

  const Gs=simulate(S, opEvent());

  OP.msg = newly.length ? `<span class="c-good">⚑ ${esc(newly.map(i=>G.tname(i)).join(', '))} taken!</span>` : ok ? '<span class="c-good">District pressed</span>' : '<span class="c-bad">Assault repelled</span>';

function opNext(id){

/* ================= Anki (AnkiConnect, Mac) ================= */
async function ankiCall(action, params){
  const ctl = new AbortController(); const tm=setTimeout(()=>ctl.abort(), 4000);
  try{
    const r = await fetch('http://127.0.0.1:8765', {method:'POST', body:JSON.stringify({action, version:6, params:params||{}}), signal:ctl.signal});
    const j = await r.json(); if(j.error) throw new Error(j.error); return j.result;
  } finally { clearTimeout(tm); }
}
async function ankiPull(silent){
  try{
    const dk = (S.settings.ankiDeck||'').trim().replace(/"/g,'');
    const scope = dk ? `deck:"${dk}" ` : '';
    const names = await ankiCall('deckNames');
    const re = dk ? new RegExp('^'+dk.replace(/[.+?^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*')+'$','i') : null;
    let picked = names.filter(n=>!re || re.test(n));
    picked = picked.filter(n=>!picked.some(o=>o!==n && n.startsWith(o+'::')));
    if(dk && !picked.length) throw new Error(`No Anki deck matches "${dk}".`);
    let due;
    try{ const st = await ankiCall('getDeckStats', {decks: picked}); due = Object.values(st).reduce((a,d)=>a+(d.review_count||0)+(d.learn_count||0),0); }
    catch(e){ due = (await ankiCall('findCards', {query: scope+'is:due'})).length; }
    const reviewed = dk ? (await ankiCall('findCards', {query: scope+'rated:1'})).length : await ankiCall('getNumCardsReviewedToday');
    // cards already scheduled for the coming days (rises when cards are failed or new ones unlocked)
    const horizon = Math.max(2, Math.min(14, S.settings.clearBy ? daysBetween(today(), S.settings.clearBy) : 5));
    const fut=[]; for(let i=1;i<=horizon;i++) fut.push((await ankiCall('findCards', {query: scope+'prop:due='+i})).length);
    let again=null; try{ again=(await ankiCall('findCards', {query: scope+'rated:1:1'})).length; }catch(e){}
    const cur=G && G.ankiByDay[today()];
    if(!cur || cur.reviewed!==reviewed || cur.due!==due || JSON.stringify(cur.fut)!==JSON.stringify(fut) || cur.again!==again) addEvent({id:'anki-'+today(), type:'anki', reviewed, due, fut, again, auto:true});
    if(!silent) toast(`Anki (${dk||'all'}): ${reviewed} reviewed today, ${due.toLocaleString()} due now, ${fut[0]} scheduled for tomorrow.`);
    return true;
  }catch(e){
    if(!silent) toast(/No Anki deck/.test(e.message) ? e.message : 'Couldn\'t reach Anki. Is it open, with AnkiConnect set up?');
    return false;
  }
}

/* ================= Sync (GitHub private repo) ================= */
const syncInfo = {state:'off', msg:'Not connected — this device only.'};
function getSyncCfg(){ try{ return JSON.parse(localStorage.getItem(LS_SYNC)); }catch(e){ return null; } }
function renderSync(){
  const el=$('#syncdot'); el.className='chip '+({ok:'ok',busy:'busy',err:'err'}[syncInfo.state]||'');
  $('#synctxt').textContent = syncInfo.state==='ok'?'Synced':syncInfo.state==='busy'?'Syncing':syncInfo.state==='err'?'Sync error':'Local';
}
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
async function gh(method, cfg, body){
  return fetch(`https://api.github.com/repos/${cfg.repo}/contents/campaign.json`, {method, cache:'no-store', headers:{'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, body: body?JSON.stringify(body):undefined});
}
let syncing=false, syncAgain=false, syncTimer=null;
function scheduleSync(){ if(!getSyncCfg()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, 1500); }
const canon = st => JSON.stringify({s:st.settings, e:[...st.events].sort((a,b)=>a.id<b.id?-1:1)});
async function syncNow(){
  const cfg=getSyncCfg(); if(!cfg || !cfg.repo || !cfg.token) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; syncInfo.state='busy'; renderSync();
  try{
    for(let attempt=0; attempt<3; attempt++){
      const r = await gh('GET', cfg);
      let remote=null, sha;
      if(r.status===404){ remote=null; }
      else if(!r.ok){ throw new Error(r.status===401?'Token rejected (401). Check the token.':r.status===403?'No permission (403). Token needs Contents: read & write.':'GitHub error '+r.status); }
      else { const j=await r.json(); sha=j.sha; remote=JSON.parse(b64dec(j.content)); }
      const merged = mergeStates(S, remote);
      const localChanged = canon(merged)!==canon(S);
      S = merged; saveLocal();
      if(localChanged) render();
      if(!remote || canon(merged)!==canon(remote)){
        const put = await gh('PUT', cfg, {message:`sync from ${device}`, content:b64enc(JSON.stringify(merged)), sha});
        if(put.status===409 || put.status===422) continue;
        if(!put.ok) throw new Error('GitHub write failed ('+put.status+')');
      }
      setTimeout(()=>uploadPendingHall().catch(()=>{}), 500);
      syncInfo.state='ok'; syncInfo.msg='Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.';
      break;
    }
  }catch(e){ syncInfo.state='err'; syncInfo.msg=(e.message||'Sync failed')+(navigator.onLine?'':' (offline)'); }
  finally{ syncing=false; renderSync(); if(tab==='settings') render(); if(syncAgain){ syncAgain=false; scheduleSync(); } }
}

const fillT=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);
function storyVars(){

let FX=null;
function startFx(kind){
  stopFx(); if(!kind || kind==='none') return;
  const cv=$('#cfx'); if(!cv) return; const ctx=cv.getContext('2d');
  const fit=()=>{ cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio; }; fit();
  const N=kind==='snow'?90:70, ps=[];
  const mk=(init)=>({x:Math.random()*cv.width, y:init?Math.random()*cv.height:(kind==='embers'?cv.height+10:-10), r:(kind==='snow'?1.2+Math.random()*2.2:0.8+Math.random()*2)*devicePixelRatio, vy:(kind==='embers'?-(0.3+Math.random()*0.9):(0.25+Math.random()*0.7))*devicePixelRatio, vx:(Math.random()-.5)*0.4*devicePixelRatio, a:0.3+Math.random()*0.6, t:Math.random()*6});
  for(let i=0;i<N;i++) ps.push(mk(true));
  const col = kind==='embers'?'255,150,60' : kind==='ash'?'170,165,160' : '235,240,250';
  FX={raf:0};
  const tick=()=>{ if(!FX) return; ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of ps){ p.t+=0.02; p.x+=p.vx+Math.sin(p.t)*0.3; p.y+=p.vy; if(p.y<-12||p.y>cv.height+12||p.x<-12||p.x>cv.width+12) Object.assign(p,mk(false));
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fillStyle=`rgba(${col},${kind==='embers'?p.a*(0.6+0.4*Math.sin(p.t*3)):p.a})`; if(kind==='embers'){ ctx.shadowColor='rgba(255,120,40,.8)'; ctx.shadowBlur=6; } ctx.fill(); }
    FX.raf=requestAnimationFrame(tick); };
  tick();
}
function stopFx(){ if(FX){ cancelAnimationFrame(FX.raf); FX=null; } const cv=$('#cfx'); if(cv){ const c=cv.getContext('2d'); c.clearRect(0,0,cv.width,cv.height); } }

async function openHallEntry(id){
  const e=hallEntries().find(x=>x.id===id); if(!e) return;
  openSheet(`<div style="text-align:center"><div class="hallshow" id="he-img">${e.img?'<span class="note">Loading image…</span>':'<span class="note">No image yet</span>'}</div>
    <h2 style="margin-top:14px;font-family:Cinzel,serif;letter-spacing:.08em">${esc(e.title||'')}</h2><div class="note">${fmtDow(e.date)} ${e.date.slice(0,4)}</div></div>
    <div class="kv" style="grid-template-columns:auto 1fr;margin-top:14px">${e.moment?`<span>The moment</span><span style="font-family:var(--body);text-align:left">${esc(e.moment)}</span>`:''}${e.cost?`<span>What it cost</span><span style="font-family:var(--body);text-align:left">${esc(e.cost)}</span>`:''}${e.decided?`<span>What I decided</span><span style="font-family:var(--body);text-align:left">${esc(e.decided)}</span>`:''}${e.numbers?`<span>Numbers</span><span style="font-family:var(--body);text-align:left">${esc(e.numbers)}</span>`:''}</div>
    <div class="actions"><button class="btn danger" data-a="hall-del" data-id="${e.id}">Delete</button><button class="btn" data-a="hall-prompt" data-id="${e.id}">Copy art prompt</button><button class="btn" data-a="hall-edit" data-id="${e.id}">Edit</button><button class="btn pri" data-a="close">Close</button></div>`);
  if(e.img){ const u=await hallImgURL(e); const box=$('#he-img'); if(box) box.innerHTML = u ? `<img src="${u}" alt="">` : '<span class="note">Image not on this device yet — it loads once sync is set up.</span>'; }
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('Copied.'); }catch(e){ toast('Copy failed — select and copy manually.'); } }

/* ================= Lifecycle ================= */
function onShow(){ syncNow(); if(localStorage.getItem(LS_ANKI)==='1') ankiPull(true); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ onShow(); maybeReport(); } else if(hallOpen){ hallOpen=false; if(tab==='hall') render(); } });
setInterval(()=>{ if(document.visibilityState==='visible' && localStorage.getItem(LS_ANKI)==='1') ankiPull(true); }, 3*60*1000);
setInterval(()=>{ if(document.visibilityState==='visible' && !syncing) syncNow(); }, 2*60*1000);
window.addEventListener('resize', ()=>{ if(VB && $('#mapsvg')){ setVB({...VB}); updateMap(); } });
let lastDay=today(); setInterval(()=>{ if(today()!==lastDay){ lastDay=today(); render(); maybeReport(); } }, 60*1000);
function maybeReport(){ if(!$('#gate').classList.contains('hidden') || CUT) return; let seen=null; try{ seen=localStorage.getItem(LS_REP); }catch(e){} if(seen!==today() && !OP && $('#sheetbg').classList.contains('hidden')) openReport(); }
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(getSyncCfg()) syncInfo.msg='Connecting…';
mapReady = loadMap().catch(err=>{ $('#view').innerHTML=`<div class="card">Couldn't load the map (${esc(err.message)}). Check your connection and reload.</div>`; throw err; });
$('#gatebtn').addEventListener('click', ()=>enterApp(true));
$('#gatequiet').addEventListener('click', ()=>enterApp(false));
</script>
</body>
